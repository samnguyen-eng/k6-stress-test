name: Load Test — 15/15/70 mix

on:
  workflow_dispatch:
    inputs:
      reservation_date:
        description: 'Reservation date (YYYY-MM-DD) — leave empty to use today'
        required: false
        default: ''
      rate:
        description: 'Target TPS'
        required: false
        default: '1500'
      duration:
        description: 'Test duration'
        required: false
        default: '3m'

jobs:
  load-test:
    name: k6 Load Test (15% me / 15% spaces / 70% reserve)
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Warm up Cloud Run
        run: |
          curl -s -o /dev/null -w "Warm-up GET /spaces → HTTP %{http_code}\n" \
            "${{ secrets.BASE_URL }}/api/parking/spaces"

      - name: Pre-warm instances (100 req/s × 30s)
        run: |
          K6_LOG_LEVEL=error k6 run scripts/reserve-stress.js \
            -e "BASE_URL=${{ secrets.BASE_URL }}" \
            -e "RATE=100" \
            -e "DURATION=30s" \
            -e "USER_COUNT=1500" \
            -e "SETUP_USER_LIMIT=100" \
            -e "PRE_ALLOCATED_VUS=200" \
            -e "MAX_VUS=200" \
            -e "RESERVATION_DATE=${{ github.event.inputs.reservation_date }}" \
            -e "PASSWORD=${{ secrets.K6_PASSWORD }}" \
            -e "SETUP_TIMEOUT=5m" \
            > /dev/null 2>&1 || true
          echo "Pre-warm done. Waiting 5s..."
          sleep 5

      - name: Run load test — ${{ github.event.inputs.rate }} TPS × ${{ github.event.inputs.duration }}
        run: |
          DATE="${{ github.event.inputs.reservation_date }}"
          if [ -z "$DATE" ]; then DATE=$(date +%Y-%m-%d); fi
          echo "Using reservation date: $DATE"

          K6_LOG_LEVEL=error k6 run scripts/load-test.js \
            -e "BASE_URL=${{ secrets.BASE_URL }}" \
            -e "RATE=${{ github.event.inputs.rate }}" \
            -e "DURATION=${{ github.event.inputs.duration }}" \
            -e "USER_COUNT=1500" \
            -e "SETUP_USER_LIMIT=1500" \
            -e "PRE_ALLOCATED_VUS=1500" \
            -e "MAX_VUS=1500" \
            -e "RESERVATION_DATE=$DATE" \
            -e "PASSWORD=${{ secrets.K6_PASSWORD }}" \
            -e "SETUP_TIMEOUT=10m" \
            --summary-export=load-summary.json

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-summary-${{ github.event.inputs.rate }}tps
          path: load-summary.json
